<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Groq Writer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Groq Writer</h1>
    <span id="status" class="muted small" aria-live="polite"></span>
  </header>

  <div id="keyWarn" class="warn" hidden>
    <span>Add an API key or endpoint to start.</span>
    <button id="openKey" class="primary">Set up</button>
  </div>

  <label class="line">
    <span>Enabled</span>
    <span class="switch">
      <input id="enabled" type="checkbox">
      <span class="track"></span>
    </span>
  </label>

  <label class="line">
    <span>On <strong id="host">this site</strong></span>
    <span class="switch">
      <input id="siteOn" type="checkbox">
      <span class="track"></span>
    </span>
  </label>

  <div id="connInfo" class="info muted small"></div>
  <div id="fieldInfo" class="info muted small" hidden></div>

  <div class="actions">
    <button id="recheck">Check this field</button>
    <button id="settings">Settings</button>
  </div>

  <div class="foot">
    <a class="foot-link" id="reportBug" href="mailto:contact@davagni.eu.org?subject=Groq%20Writer%20%E2%80%94%20bug%20report" title="Email a bug report, a question or a feature request">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.6 6.4 12 12.6l8.4-6.2"/></svg>
      <span>Report a bug</span>
    </a>
    <button class="foot-link" id="shortcuts" type="button" title="Quick action settings and keyboard shortcuts">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>
      <span>Shortcuts</span>
    </button>
    <button class="foot-link support" id="support" type="button" title="Support the project">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 21s-6.716-4.35-9.428-8.06C.86 10.44 1.02 7.2 3.34 5.34 5.4 3.69 8.28 4.06 10 6.02L12 8.3l2-2.28c1.72-1.96 4.6-2.33 6.66-.68 2.32 1.86 2.48 5.1.77 7.6C18.716 16.65 12 21 12 21z"/></svg>
      <span>Support</span>
    </button>
  </div>

  <p id="hint" class="muted small hint"></p>

  <script type="module" src="popup.js"></script>
</body>
</html>
